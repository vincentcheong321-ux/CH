
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CH System</title>
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          console.log('Starting fetch fix check...');
          const descriptor = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (window.fetch && descriptor && descriptor.get && !descriptor.set && descriptor.configurable) {
            console.log('Applying fetch fix...');
            const originalFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              value: originalFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } else if (!window.fetch) {
            console.warn('window.fetch is missing, polyfill will be loaded later.');
          }
        } catch (e) {
          console.warn('Failed to apply fetch fix:', e);
        }
      })();
      
      window.onerror = function(msg, url, line, col, error) {
        console.error('GLOBAL ERROR:', msg, 'at', url, ':', line, ':', col, error);
        // Alert only if we are in a debug mode or if it's a critical failure
        // alert('Error: ' + msg + '\nAt: ' + url + ':' + line);
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
      }

      .font-hand {
        font-family: 'Patrick Hand', cursive;
      }

      .whitespace-pre-wrap {
        white-space: pre-wrap;
      }
      
      @media print {
        @page {
          size: auto;
          margin: 15mm;
        }
        
        /* Hide scrollbars and body content */
        body {
          visibility: hidden;
          background-color: white;
          margin: 0;
          padding: 0;
          overflow: visible !important;
          height: auto !important;
        }

        /* The Printable Area Overlay */
        /* We use fixed positioning to ensure it takes over the viewport/page completely, ignoring parent layout constraints */
        #printable-area {
          visibility: visible !important;
          display: block !important;
          position: absolute; /* Changed to absolute to flow correctly across pages */
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0;
          background: white;
          z-index: 9999;
        }

        /* Ensure everything inside is visible */
        #printable-area * {
          visibility: visible !important;
        }

        /* Strict hiding for non-printable elements */
        .no-print, .no-print * {
          display: none !important;
          height: 0 !important;
          width: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
          visibility: hidden !important;
        }

        /* Table Styling for Print */
        table {
          width: 100% !important;
          border-collapse: collapse !important;
          font-size: 12px;
        }

        thead tr {
          background-color: #f3f4f6 !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        th, td {
          border: 1px solid #ddd !important;
          padding: 6px 8px !important;
          color: black !important;
        }

        /* Typography */
        h1, h2, h3, p, span {
          color: black !important;
        }

        /* Hide buttons/links */
        button {
          display: none !important;
        }
        
        a {
            text-decoration: none !important;
            color: black !important;
        }

        /* Textarea handling in print */
        textarea {
            display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: #666;">
        <p>Loading CH System...</p>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
